# Deliberately writes vcDataModelVersions as an unquoted YAML list. YAML reads the
# entries as floats, so "2.0" reaches the verifier as "2". The verifier normalizes
# these spellings; this fixture pins the decoding behaviour that makes that necessary.
server:
  port: 3000
logging:
  level: "DEBUG"
  jsonLogging: true
  logRequests: true

verifier:
  did: "did:key:somekey"
  tirAddress: "https://test.dev/trusted_issuer/v3/issuers/"
  sessionExpiry: 30
  vcDataModelVersions: [1.1, 2.0]

m2m:
  authEnabled: false
