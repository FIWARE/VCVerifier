server:
  port: 3000

eidas:
  enabled: true
  lotlUrl: "https://ec.europa.eu/tools/lotl/eu-lotl.xml"
  refreshInterval: 86400

configRepo:
  services:
    - id: testService
      defaultOidcScope: eidasScope
      oidcScopes:
        eidasScope:
          credentials:
            - type: VerifiableCredential
              trustedIssuersLists:
                - https://tir.example.com
              eidasConfig:
                enabled: true
