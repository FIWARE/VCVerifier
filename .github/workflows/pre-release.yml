name: Pre-Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

concurrency:
  group: pre-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  REPOSITORY: fiware
  IMAGE_NAME: vcverifier

jobs:
  # The version from the semver label of the pull request, read when the job runs. See
  # https://github.com/FIWARE/github-workflows
  generate-version:
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  build-scan-push:
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile
        run: go build -o app .

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    needs: generate-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o vcverifier-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: vcverifier-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vcverifier-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  # Publishes the pre-release, replacing the one of the previous push, see
  # https://github.com/FIWARE/github-workflows
  git-release:
    needs: 
      - generate-version
      - build-scan-push
      - build-binaries
    uses: FIWARE/github-workflows/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.generate-version.outputs.version }}
      prerelease: true
      files: |
        LICENSE
        release-assets/vcverifier-*
      artifact-pattern: vcverifier-*
